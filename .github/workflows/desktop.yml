name: App desktop (Mac e Windows)

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test

  build:
    needs: testes
    strategy:
      matrix:
        include:
          - os: macos-latest
            alvo: mac
          - os: windows-latest
            alvo: win
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: Gerar instalador
        run: npm run dist:${{ matrix.alvo }}
        env:
          # Sem certificado: o instalador sai sem assinatura digital
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Solicitacoes-${{ matrix.alvo }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
